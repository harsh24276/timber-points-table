<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TIMBER Score Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
  <div id="toastContainer"></div>

  <div class="hero-header" id="hero-header">
    <div class="hero-title">TIMBER</div>
    <div class="hero-subtitle">Score Calculator</div>
  </div>

  <div class="container">
    <div id="setupArea">
      <h2 class="setup-title">New Game Setup</h2>
      <label for="numPlayers">Number of Players</label>
      <select id="numPlayers" onchange="createPlayerInputs()">
        <option value="2">2 Players</option>
        <option value="3" selected>3 Players</option>
        <option value="4">4 Players</option>
        <option value="5">5 Players</option>
        <option value="6">6 Players</option>
        <option value="7">7 Players</option>
        <option value="8">8 Players</option>
      </select>
      <div id="playerNamesDiv"></div>
      <button class="start-btn" onclick="startGame()">START GAME</button>
    </div>

    <div id="gameArea"></div>
  </div>

  <button id="newGameBtn" onclick="newGame()" style="display:none;">NEW GAME</button>

  <button id="historyBtn" onclick="openHistoryModal()">&#x1F551; VIEW GAME HISTORY</button>

  <div id="historyModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeHistoryModal()">&times;</span>
      <h2 style="margin-top: 0;">Saved Games History</h2>
      <div id="historyList"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
